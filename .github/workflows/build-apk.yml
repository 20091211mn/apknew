name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install PWA to APK Tool
        run: npm install -g pwa2apk

      - name: Generate APK
        run: pwa2apk --url https://20091211mn.github.io/apknew/ --out ./app.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-APK
          path: ./*.apk
