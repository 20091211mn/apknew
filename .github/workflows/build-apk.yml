name: Build Stable Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate Android Project via Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          cat << 'JSON' > twa-manifest.json
          {
            "packageId": "com.apknew.app",
            "host": "20091211mn.github.io",
            "name": "تطبيقي",
            "launcherName": "تطبيقي",
            "display": "standalone",
            "themeColor": "#1e1e2f",
            "navigationColor": "#121212",
            "backgroundColor": "#121212",
            "enableNotifications": false,
            "startUrl": "/apknew/",
            "iconUrl": "https://dummyimage.com/512x512/000/fff.png",
            "maskableIconUrl": "https://dummyimage.com/512x512/000/fff.png",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://20091211mn.github.io/apknew/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": { "enabled": false }
          }
          JSON
          bubblewrap init --manifest=twa-manifest.json --directory=android-project

      - name: Build APK using Gradle (Official Android Tool)
        run: |
          cd android-project
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Debug-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
