name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  BUBBLEWRAP_KEYSTORE_PASSWORD: android123
  BUBBLEWRAP_KEY_PASSWORD: android123

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Configure Bubblewrap
      run: |
        mkdir -p ~/.bubblewrap
        cat << JSON > ~/.bubblewrap/config.json
        {
          "jdkPath": "$JAVA_HOME",
          "androidSdkPath": "$ANDROID_HOME"
        }
        JSON

    - name: Create TWA Configuration
      run: |
        cat << 'JSON' > twa-manifest.json
        {
          "packageId": "io.github.mn20091211.apknew",
          "host": "20091211mn.github.io",
          "name": "APK New App",
          "launcherName": "APK New",
          "display": "standalone",
          "orientation": "default",
          "themeColor": "#FFFFFF",
          "navigationColor": "#000000",
          "backgroundColor": "#FFFFFF",
          "enableNotifications": false,
          "startUrl": "/apknew/",
          "iconUrl": "https://20091211mn.github.io/apknew/icon-512.png",
          "maskableIconUrl": "https://20091211mn.github.io/apknew/icon-512.png",
          "webManifestUrl": "https://20091211mn.github.io/apknew/manifest.json",
          "appVersionName": "1.0.0",
          "appVersion": "1",
          "appVersionCode": 1,
          "generatorApp": "bubblewrap-cli",
          "fallbackType": "customtabs",
          "minSdkVersion": 21,
          "signingKey": {
            "path": "./android.keystore",
            "alias": "android"
          },
          "features": {},
          "alphaDependencies": {
            "enabled": false
          }
        }
        JSON

    - name: Generate Keystore
      run: |
        keytool -genkeypair -v \
          -keystore android.keystore \
          -alias android \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" \
          -keypass "$BUBBLEWRAP_KEY_PASSWORD" \
          -dname "CN=APK New, OU=Dev, O=MN, C=LY"

    - name: Generate Android Project
      run: bubblewrap update --skipVersionUpgrade

    - name: Build APK
      run: bubblewrap build --skipPwaValidation

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: App-APK
        path: ./app-release-signed.apk
