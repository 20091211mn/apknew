name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Android APK via PWABuilder
        uses: pwa-builder/pwa-action@v1
        with:
          manifest-url: 'https://20091211mn.github.io/apknew/manifest.json'
          output-type: 'apk'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-APK
          path: './*.apk'
