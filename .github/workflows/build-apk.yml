name: Build Android APK with Cordova

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova App & Set WebView
        run: |
          # إنشاء مشروع جديد
          cordova create myApp com.apknew.app "تطبيقي"
          cd myApp
          
          # إضافة منصة الأندرويد
          cordova platform add android
          
          # توجيه التطبيق لفتح رابط موقعك مباشرة داخل WebView
          cat << 'XML' > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.apknew.app" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>تطبيقي</name>
              <description>تطبيق ويب</description>
              <author email="dev@example.com">Developer</author>
              <content src="https://20091211mn.github.io/apknew/" />
              <allow-navigation href="https://20091211mn.github.io/apknew/*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <preference name="Scheme" value="https" />
          </widget>
          XML

      - name: Build Android APK
        run: |
          cd myApp
          cordova build android --debug

      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Cordova-APK
          path: myApp/platforms/android/app/build/outputs/apk/debug/*.apk
