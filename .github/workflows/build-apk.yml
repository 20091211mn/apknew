name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Initialize Bubblewrap Configuration
      run: |
        mkdir -p ~/.bubblewrap
        cat << 'JSON' > ~/.bubblewrap/config.json
        {
          "jdkPath": "/usr/lib/jvm/temurin-17-amd64",
          "androidSdkPath": "/usr/local/lib/android/sdk"
        }
        JSON

    - name: Create TWA Configuration
      run: |
        cat << 'JSON' > twa-manifest.json
        {
          "packageId": "io.github.mn20091211.apknew",
          "host": "20091211mn.github.io",
          "name": "APK New App",
          "launcherName": "APK New",
          "display": "standalone",
          "themeColor": "#FFFFFF",
          "navigationColor": "#000000",
          "backgroundColor": "#FFFFFF",
          "enableNotifications": false,
          "startUrl": "/apknew/",
          "iconUrl": "https://github.io",
          "maskableIconUrl": "https://github.io",
          "appVersionName": "1.0.0",
          "appVersionCode": 1,
          "generatorApp": "bubblewrap-cli",
          "webManifestUrl": "https://github.io",
          "fallbackType": "customtabs",
          "features": {},
          "alphaDependencies": {
            "enabled": false
          }
        }
        JSON

    - name: Generate Android Project & Build APK
      run: |
        bubblewrap init --manifest=twa-manifest.json --skipIntermediatePrompt --yes
        bubblewrap build --skipSigning --yes

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: App-APK
        path: ./*.apk
