name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli
          yes | bubblewrap init --manifest=https://20091211mn.github.io/apknew/manifest.json

      - name: Build Signed APK
        run: |
          bubblewrap build

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: App-APK
          path: ./*.apk
