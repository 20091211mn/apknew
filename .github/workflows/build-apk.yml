name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Create TWA Manifest
        run: |
          cat << 'JSON' > twa-manifest.json
          {
            "packageId": "com.apknew.app",
            "host": "20091211mn.github.io",
            "name": "تطبيقي",
            "launcherName": "تطبيقي",
            "display": "standalone",
            "themeColor": "#1e1e2f",
            "navigationColor": "#121212",
            "backgroundColor": "#121212",
            "enableNotifications": false,
            "startUrl": "/apknew/",
            "iconUrl": "https://dummyimage.com/512x512/000/fff.png",
            "maskableIconUrl": "https://dummyimage.com/512x512/000/fff.png",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://20091211mn.github.io/apknew/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            }
          }
          JSON

      - name: Build Unsigned APK
        run: |
          # 1. إنشاء أداة مشروع Gradle أولاً
          bubblewrap init --manifest=twa-manifest.json
          
          # 2. تحديد مسارات صريحة ومكتملة لـ Build Tools و SDK
          export ANDROID_HOME=/usr/local/lib/android/sdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33" "cmdline-tools;latest"

          mkdir -p ~/.bubblewrap
          cat << JSON > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          JSON

          # 3. البناء التلقائي
          bubblewrap build --skipSigning

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-APK
          path: ./*.apk
